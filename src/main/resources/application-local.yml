# Profile para desenvolvimento local com H2
spring:
  datasource:
    url: jdbc:h2:mem:walletpix;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    br.com.walletpix: DEBUG
